---
version: "2.0"
services:
  claude-code:
    image: ghcr.io/decloudnodeslab/claude-code:latest@sha256:431301015bd31a2f11e969975bf9517ad363a5191ab077a2235e70c80de42d72
    env:
      - WEB_PORT=8080
      - WEB_PASSWORD=CHANGE_ME_TO_A_LONG_RANDOM_PASSWORD
      - CLAUDE_CONFIG_DIR=/home/coder/.claude
      - DISABLE_AUTOUPDATER=1
    params:
      storage:
        claude:
          mount: /home/coder/
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
profiles:
  compute:
    claude-code:
      resources:
        cpu:
          units: 2.0
        memory:
          size: 6Gi
        storage:
          - size: 4Gi
          - name: claude
            size: 32Gi
            attributes:
              persistent: true
              class: beta3
  placement:
    akash:
      pricing:
        claude-code:
          denom: uact
          amount: 100000
deployment:
  claude-code:
    akash:
      profile: claude-code
      count: 1
